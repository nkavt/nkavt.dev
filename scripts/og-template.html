<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 400px; height: 400px; background: #0b0d10; }
  .tile {
    width: 400px; height: 400px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
    background: #0b0d10;
    background-image: linear-gradient(#11151a 1px, transparent 1px), linear-gradient(90deg, #11151a 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .tile::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 55%, rgba(126,231,135,0.14), transparent 60%); }
  .glyph {
    position: relative; z-index: 1; display: flex; align-items: center;
    font-family: 'JetBrains Mono', monospace; font-size: 190px; font-weight: 600; color: #7ee787; letter-spacing: -0.06em; line-height: 1;
  }
  .cursor { display: inline-block; width: 26px; height: 136px; margin-left: 20px; background: #7ee787; }
</style>
</head>
<body>
<div class="tile"><div class="glyph">~/<span class="cursor"></span></div></div>
</body>
</html>
